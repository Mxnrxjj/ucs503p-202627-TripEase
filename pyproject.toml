
[build-system]
requires = ["hatchling","hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tripease"
version = "0.0.1"
authors = [
  { name="Nimitt Malhotra" },
  { name="Manraj Singh" },
  { name="Vatsal Chauhan" },
]
description = "TripEase: an integrated trip planning and itinerary management system (UCS503 project)"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    # See: https://pypi.org/classifiers/
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Unix Shell",
]
dependencies = ["click"]

[project.urls]
Homepage = "https://github.com/Mxnrxjj/ucs503p-202627-TripEase"
Issues = "https://github.com/Mxnrxjj/ucs503p-202627-TripEase/issues"

# Adapted from https://stackoverflow.com/a/50156706
[tool.pytest.ini_options]
pythonpath = [
  "code"
]
# THE END -------------------------------------------
